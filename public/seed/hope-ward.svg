<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="Abstract sunrise on paper">
  <rect width="1200" height="675" fill="#EAE5D9"/>
  <!-- ledger rules -->
  <g stroke="#101010" stroke-opacity="0.07">
    <path d="M0 96H1200M0 160H1200M0 224H1200M0 288H1200M0 352H1200M0 416H1200"/>
  </g>
  <!-- rays as hairlines -->
  <g stroke="#101010" stroke-opacity="0.16">
    <path d="M600 470L120 120M600 470L280 60M600 470L470 30M600 470L730 30M600 470L920 60M600 470L1080 120"/>
  </g>
  <!-- sun: concentric rings rising over the horizon -->
  <g fill="#E4321B" transform="translate(600 470)">
    <circle r="420" fill-opacity="0.05"/>
    <circle r="330" fill-opacity="0.06"/>
    <circle r="250" fill-opacity="0.08"/>
    <circle r="180" fill-opacity="0.12"/>
    <circle r="120" fill-opacity="0.22"/>
    <circle r="72" fill-opacity="0.9"/>
  </g>
  <!-- ground plane -->
  <rect y="470" width="1200" height="205" fill="#F3EFE6"/>
  <path d="M0 470H1200" stroke="#101010" stroke-opacity="0.5" stroke-width="1.5"/>
  <path d="M0 510H1200" stroke="#101010" stroke-opacity="0.18" stroke-dasharray="4 6"/>
  <path d="M0 550H1200" stroke="#101010" stroke-opacity="0.12" stroke-dasharray="4 6"/>
  <path d="M0 590H1200" stroke="#101010" stroke-opacity="0.08" stroke-dasharray="4 6"/>
  <!-- corner ledger mark -->
  <g fill="#101010" fill-opacity="0.55" font-family="Geist Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" letter-spacing="2.5">
    <text x="48" y="632">CAIRO · 30.04° N</text>
    <text x="1152" y="632" text-anchor="end">No. 0001</text>
  </g>
</svg>
