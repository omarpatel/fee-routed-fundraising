<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-label="Screenshot of a fundraiser donation confirmation page">
  <defs>
    <style>
      .sans { font-family: Geist, Inter, system-ui, -apple-system, "Segoe UI", sans-serif; }
      .mono { font-family: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, monospace; }
    </style>
  </defs>
  <rect width="1200" height="800" fill="#DFD9CA"/>
  <!-- browser chrome -->
  <rect x="0" y="0" width="1200" height="56" fill="#EAE5D9"/>
  <g fill="#101010" fill-opacity="0.35">
    <circle cx="28" cy="28" r="6"/><circle cx="50" cy="28" r="6"/><circle cx="72" cy="28" r="6"/>
  </g>
  <rect x="120" y="16" width="960" height="24" rx="6" fill="#F3EFE6"/>
  <text x="136" y="33" class="mono" font-size="12" fill="#101010" fill-opacity="0.6">https://www.gofundme.com/f/hope-ward-demo/donate/confirmation</text>
  <path d="M0 56H1200" stroke="#101010" stroke-opacity="0.15"/>
  <!-- page -->
  <rect x="0" y="57" width="1200" height="743" fill="#FFFFFF"/>
  <rect x="0" y="57" width="1200" height="64" fill="#FFFFFF"/>
  <path d="M0 121H1200" stroke="#101010" stroke-opacity="0.1"/>
  <text x="80" y="97" class="sans" font-size="20" font-weight="600" fill="#101010">Fundraiser</text>
  <text x="1120" y="97" class="sans" font-size="14" fill="#101010" fill-opacity="0.6" text-anchor="end">Signed in</text>
  <!-- card -->
  <rect x="300" y="170" width="600" height="560" rx="12" fill="#FFFFFF" stroke="#101010" stroke-opacity="0.14"/>
  <circle cx="600" cy="238" r="30" fill="#101010"/>
  <path d="M586 238L596 248L615 228" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="square"/>
  <text x="600" y="308" class="sans" font-size="28" font-weight="600" fill="#101010" text-anchor="middle">Thank you for your donation</text>
  <text x="600" y="340" class="sans" font-size="15" fill="#101010" fill-opacity="0.6" text-anchor="middle">A confirmation email has been sent to ops@example.com</text>
  <g class="sans" font-size="15" fill="#101010">
    <path d="M340 380H860" stroke="#101010" stroke-opacity="0.1"/>
    <text x="340" y="412" fill-opacity="0.6">Amount</text>
    <text x="860" y="412" text-anchor="end" class="mono" font-size="16">$2,400.00 USD</text>
    <path d="M340 432H860" stroke="#101010" stroke-opacity="0.1"/>
    <text x="340" y="464" fill-opacity="0.6">Tip to platform</text>
    <text x="860" y="464" text-anchor="end" class="mono" font-size="16">$0.00</text>
    <path d="M340 484H860" stroke="#101010" stroke-opacity="0.1"/>
    <text x="340" y="516" fill-opacity="0.6">Payment method</text>
    <text x="860" y="516" text-anchor="end" class="mono" font-size="16">Visa •••• 4821</text>
    <path d="M340 536H860" stroke="#101010" stroke-opacity="0.1"/>
    <text x="340" y="568" fill-opacity="0.6">Donor name</text>
    <text x="860" y="568" text-anchor="end">Fee Router (on behalf of token holders)</text>
    <path d="M340 588H860" stroke="#101010" stroke-opacity="0.1"/>
    <text x="340" y="620" fill-opacity="0.6">Reference</text>
    <text x="860" y="620" text-anchor="end" class="mono" font-size="16">DN-7Q4M-2K8X</text>
    <path d="M340 640H860" stroke="#101010" stroke-opacity="0.1"/>
  </g>
  <rect x="340" y="668" width="520" height="40" rx="6" fill="#101010"/>
  <text x="600" y="694" class="sans" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="middle">Download receipt</text>
</svg>
